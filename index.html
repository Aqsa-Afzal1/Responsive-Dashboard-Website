<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link
      rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"/>
     <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main swiper mySwiper">
      <div class="wrapper swiper-wrapper">
        <div class="slide swiper-slide">
          <img
            src="vecteezy_barista-pouring-milk-into-a-cup-of-latte-art-coffee-a_24583249.jpg"
            alt=""
            class="image"
          />
          <div class="image-data">
            <span class="text">Enjoy the finest coffee drinks.</span>
            <h2>
              Enjoy Our Exclusive <br />
              Coffee and Cocktails
            </h2>
            <a href="#" class="button">About U</a>
          </div>
        </div>
        <div class="slide swiper-slide">
          <img
            src="vecteezy_the-side-angle-view-of-a-cup-of-coffee-on-the-table-with_23010432.jpg"
            alt=""
            class="image"
          />
          <div class="image-data">
            <span class="text">Experience the best desserts.</span>
            <h2>
              Sweeten Your Day <br />
              With Our Treats
            </h2>
            <a href="#" class="button">Explore</a>
          </div>
        </div>
        <div class="slide swiper-slide">
          <img
            src="the-cup-of-latte-coffee-with-heart-shaped-latte-art-and-ai-generated-free-photo.jpg"
            alt=""
            class="image"
          />
          <div class="image-data">
            <span class="text">Relax in our cozy atmosphere.</span>
            <h2>
              A Place to Unwind <br />
              and Enjoy Life
            </h2>
            <a href="#" class="button">Visit Us</a>
          </div>
        </div>
      </div>
      <div class="swiper-button-next nav-btn"></div>
      <div class="swiper-button-prev nav-btn"></div>
      <div class="swiper-pagination"></div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
